<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transcriber</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 12px; }
      button { padding: 10px 14px; border-radius: 9999px; border: 1px solid #e2e8f0; background: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(2,6,23,.06); }
      button[disabled] { opacity: .6; cursor: not-allowed; }
      .row { display: flex; gap: 8px; align-items: center; }
      .status { font-size: 12px; color: #555; margin-top: 8px; }
      .mic { width: 16px; height: 16px; border-radius: 9999px; background: #ef4444; box-shadow: 0 0 0 0 rgba(239,68,68,.7); animation: pulse 1.5s infinite; display: none; }
      .mic.on { display: inline-block; }
      @keyframes pulse { 0%{ box-shadow: 0 0 0 0 rgba(239,68,68,.7);} 70%{ box-shadow: 0 0 0 10px rgba(239,68,68,0);} 100%{ box-shadow: 0 0 0 0 rgba(239,68,68,0);} }
    </style>
  </head>
  <body>
    <div class="row" style="justify-content: space-between; width: 240px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <div id="mic" class="mic"></div>
        <div style="font-weight:600;">Transcriber</div>
      </div>
      <div class="row">
        <button id="startBtn">Start</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>
    </div>
    <div class="status" id="status">Idle</div>
    <div id="log" style="margin-top:8px; max-height:160px; overflow:auto; border:1px solid #eee; padding:6px; border-radius:6px; font-size:12px; line-height:1.4"></div>
    <script type="module" src="popup.js"></script>
  </body>
  </html>
